[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmatimer-api"
version = "0.7.7"  # SENTINEL_N5O_TAILSCALE_HTTPS_APPLY_CP6_PYPROJECT_BUMP_0_7_1 CORS dual-origin tailnet + .env.dev MOD + tailscale serve HTTPS smoke verde + tag v3.2.0-alpha.9
description = "PharmaTimer backend API (FastAPI + MySQL nativo Studio + multi-tenant)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Roberto" }]
license = { text = "Proprietary" }
keywords = ["pharmatimer", "fastapi", "mysql", "multi-tenant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    "fastapi>=0.136,<0.140",
    "uvicorn[standard]>=0.47,<0.50",
    "mysql-connector-python>=9.7,<10",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "httpx>=0.28,<0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    # ruff sta qui e non in un requirements a parte: fonte unica. Il Makefile
    # lo pretende in backend/venv/bin/ruff, e la CI lo installa da qui.
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pharmatimer_api*"]
exclude = ["tests*", "venv*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "strict"

[tool.ruff]
# Configurazione MINIMA. Il perimetro e il solo codice di prodotto piu i test:
# le migrazioni sono one-shot storici e non si normano a posteriori.
line-length = 100
target-version = "py312"
exclude = ["venv", "__pycache__", "db/migrations", "*.bak", "*.bak.*"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (import e nomi morti), I ordinamento import,
# B bugbear (trappole reali, non stile), UP modernizzazioni sicure.
# PLC2401 e PLC2403: identificatori e nomi di import solo ASCII, che e la
# parte di convenzione tipografica (CLAUDE.md, in testa) misurabile da un
# linter. Il resto la misura scripts/audit/tipografia.py.
select = ["E", "W", "F", "I", "B", "UP", "PLC2401", "PLC2403"]
ignore = [
    "E501",  # lunghezza riga: gia governata da line-length e non si impone qui
    # B008 -- "non chiamare funzioni nei default degli argomenti". Con FastAPI
    # e FALSO PER COSTRUZIONE: Depends(...) e Query(...) nei default SONO il
    # modo in cui il framework si scrive. Misurati 40 reperti, tutti su router
    # e dependencies, nessuno un difetto. Baselinarli sarebbe rumore permanente,
    # perche non possono scendere finche si usa FastAPI.
    "B008",
    # UP042 -- "usa StrEnum invece di ereditare da str e Enum". Due reperti,
    # RepositoryErrorCode e RepositoryErrorSeverity in exceptions.py. Ruff
    # stesso marca il fix UNSAFE, e StrEnum esiste solo da python 3.11: la
    # versione che gira sul Mini di produzione NON e misurabile da qui, e
    # convertire alla cieca romperebbe lo import allo avvio del servizio.
    # Misurato che la conversione sarebbe neutra sul filo: il handler
    # serializza con .value esplicito e nessuna sede usa str() o una
    # f-string su quei membri. Resta quindi una scelta di schieramento, non
    # un difetto: si toglie da qui il giorno in cui si misura python >= 3.11
    # sul Mini.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# I test usano fixture pytest come argomenti: shadowing e la loro forma normale.
"tests/*" = ["F811", "B008"]
