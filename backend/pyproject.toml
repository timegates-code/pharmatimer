[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmatimer-api"
version = "0.7.4"  # SENTINEL_N5O_TAILSCALE_HTTPS_APPLY_CP6_PYPROJECT_BUMP_0_7_1 CORS dual-origin tailnet + .env.dev MOD + tailscale serve HTTPS smoke verde + tag v3.2.0-alpha.9
description = "PharmaTimer backend API (FastAPI + MySQL nativo Studio + multi-tenant)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Roberto" }]
license = { text = "Proprietary" }
keywords = ["pharmatimer", "fastapi", "mysql", "multi-tenant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    "fastapi>=0.136,<0.140",
    "uvicorn[standard]>=0.47,<0.50",
    "mysql-connector-python>=9.7,<10",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "httpx>=0.28,<0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pharmatimer_api*"]
exclude = ["tests*", "venv*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "strict"
